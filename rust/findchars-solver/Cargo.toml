[package]
name = "findchars-solver"
description = "Z3-based constraint solver for libfindchars shuffle LUT generation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/findchars-solver"
readme = "README.md"
keywords = ["simd", "z3", "solver", "shuffle", "sat"]
categories = ["text-processing", "algorithms"]

[package.metadata.docs.rs]
all-features = false

[dependencies]
z3 = { version = "0.20", features = ["vendored"] }
