[workspace]
resolver = "2"
members = [
    "findchars",
    "findchars-solver",
    "findchars-csv",
    "findchars-bench",
    "findchars-examples",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/debe/libfindchars"
homepage = "https://github.com/debe/libfindchars"

# Inter-crate dependencies carry both `path` (for local builds) and `version`
# (required when publishing to crates.io). `release-rust.sh` bumps both.
[workspace.dependencies]
findchars = { path = "findchars", version = "0.1.0" }
findchars-solver = { path = "findchars-solver", version = "0.1.0" }
findchars-csv = { path = "findchars-csv", version = "0.1.0" }
thiserror = "2"
